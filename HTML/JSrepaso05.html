<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/JSrepaso05.css">
</head>
<body>
    <label>Edad:</label>
    <input type="text" id="AgeField">
    <br><br>
    <input type="button" id="BtnAge" value="click">
    <div>

    </div>
    <script>
        const miBtn=document.querySelector("#BtnAge");
        miBtn.addEventListener("click", ()=> {
            
            let edad=document.getElementById("AgeField").value;
            const miDiv=document.querySelector("Div");
            miDiv.innerHTML="Tu edad es " + edad ;

        })
    </script>
</body>
</html>
